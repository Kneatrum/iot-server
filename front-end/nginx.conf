# /etc/nginx/nginx.conf
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define an upstream for the back-end service only
    upstream backend {
        server back-end:3000;
    }

    # always redirect to https
    server {
        listen 80 default_server;

        server_name dopesilicon.com;

        return 301 https://$host$request_uri;
    }

    # HTTP server block
    server {
        listen 443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/dopesilicon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dopesilicon.com/privkey.pem;
        server_name dopesilicon.com;  # Replace with domain name later.
        root /usr/share/nginx/html;  # Serve static files from here

        # Serve static files and handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-cache";
        }

        # Proxy to the back-end service for API calls
        location ~ ^/(api|users)/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}


