user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Basic optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Backend service definition (for reverse proxy)
    upstream backend {
        server back-end:3000; # Ensure this matches the Docker service name
        keepalive 64;
    }

    # Redirect all HTTP requests to HTTPS
    server {
        listen 80;
        server_name dopesilicon.com www.dopesilicon.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot; # Certbot challenges are served from here
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block
    server {
        listen 443 ssl http2;
        server_name dopesilicon.com www.dopesilicon.com;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/dopesilicon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dopesilicon.com/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Serve static files (React build)
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
            expires 1h;
            add_header Cache-Control "public, no-cache";
        }

        # Reverse proxy to Node.js backend (for API calls)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Certbot challenge endpoint for renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }
    }
}
