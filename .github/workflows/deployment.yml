name: EC2 Deployment

on:
  push:
    branches:
      - deployment
    paths:
      - docker-compose.yml
      - nginx.conf
      - '**/Dockerfile'
      - '**/src/**'
      - '**/*.env'
      - '.github/workflows/deployment.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Generate version from Git commit hash
        id: version
        run: |
          GIT_COMMIT=$(git rev-parse --short HEAD)
          echo "VERSION=$GIT_COMMIT" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      - name: Build and Push Updated Images
        run: |
          if [ -d "./back-end" ]; then
            docker build -t 182399716240.dkr.ecr.us-east-1.amazonaws.com/back-end:$VERSION ./back-end
            docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/back-end:$VERSION
          fi

          if [ -d "./front-end" ]; then
            docker build -t 182399716240.dkr.ecr.us-east-1.amazonaws.com/front-end:$VERSION ./front-end
            docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/front-end:$VERSION
          fi

          if [ -d "./mosquitto" ]; then
            docker build -t 182399716240.dkr.ecr.us-east-1.amazonaws.com/mosquitto:$VERSION ./mosquitto
            docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/mosquitto:$VERSION
          fi

      - name: Update docker-compose.yml with new version
        run: |
          sed -i "s|182399716240.dkr.ecr.us-east-1.amazonaws.com/back-end:.*|182399716240.dkr.ecr.us-east-1.amazonaws.com/back-end:$VERSION|" docker-compose.yml
          sed -i "s|182399716240.dkr.ecr.us-east-1.amazonaws.com/front-end:.*|182399716240.dkr.ecr.us-east-1.amazonaws.com/front-end:$VERSION|" docker-compose.yml
          sed -i "s|182399716240.dkr.ecr.us-east-1.amazonaws.com/mosquitto:.*|182399716240.dkr.ecr.us-east-1.amazonaws.com/mosquitto:$VERSION|" docker-compose.yml

      - name: Sign in to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          # Decode the Base64 private key
          echo "$PRIVATE_KEY" | base64 --decode > github-ec2.pem
          chmod 600 github-ec2.pem

          # Verify if the key is correctly formatted
          ssh-keygen -y -f github-ec2.pem > /dev/null || { echo "Invalid private key!"; exit 1; }

          # Ensure the back-end, front-end, and mosquitto directories exist on EC2
          ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST} << 'EOF'
            mkdir -p /home/ubuntu/iot-server/back-end
            mkdir -p /home/ubuntu/iot-server/front-end
            mkdir -p /home/ubuntu/iot-server/mosquitto
          EOF

          # Upload docker-compose.yml and nginx.conf using SCP
          scp -o StrictHostKeyChecking=no -i github-ec2.pem docker-compose.yml ${USER}@${HOST}:/home/ubuntu/iot-server/
          scp -o StrictHostKeyChecking=no -i github-ec2.pem nginx.conf ${USER}@${HOST}:/home/ubuntu/iot-server/

          # Upload other necessary files
          scp -o StrictHostKeyChecking=no -i github-ec2.pem front-end/.env ${USER}@${HOST}:/home/ubuntu/iot-server/front-end/
          scp -o StrictHostKeyChecking=no -i github-ec2.pem front-end/Dockerfile ${USER}@${HOST}:/home/ubuntu/iot-server/front-end/
          scp -o StrictHostKeyChecking=no -i github-ec2.pem back-end/.env ${USER}@${HOST}:/home/ubuntu/iot-server/back-end/
          scp -o StrictHostKeyChecking=no -i github-ec2.pem back-end/Dockerfile ${USER}@${HOST}:/home/ubuntu/iot-server/back-end/
          scp -r -o StrictHostKeyChecking=no -i github-ec2.pem mosquitto ${USER}@${HOST}:/home/ubuntu/iot-server/

      - name: Deploy to Docker Swarm
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" | base64 --decode > github-ec2.pem
          chmod 600 github-ec2.pem

          ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST} << 'EOF'
            cd /home/ubuntu/iot-server/

            # Configure AWS CLI with the region
            export AWS_DEFAULT_REGION=us-east-1

            # Get ECR login token and login to Docker
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 182399716240.dkr.ecr.us-east-1.amazonaws.com

            # Deploy the stack with the updated docker-compose.yml
            docker stack deploy -c docker-compose.yml iot
          EOF