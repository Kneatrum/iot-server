name: EC2 Deployment.

on:
  push:
    branches:
      - deployment
    paths:
      - docker-compose.yml
      - nginx.conf
      - '**/Dockerfile'
      - '**/src/**'
      - '**/*.env'
      - '.github/workflows/deployment.yml' 
      - '**/back-end/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push Updated Images
      run: |
        if [ -d "./back-end" ]; then
          docker build -t back-end ./back-end
          docker tag back-end:latest 182399716240.dkr.ecr.us-east-1.amazonaws.com/back-end:latest
          docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/back-end:latest
        fi

        if [ -d "./front-end" ]; then
          docker build -t front-end ./front-end
          docker tag front-end:latest 182399716240.dkr.ecr.us-east-1.amazonaws.com/front-end:latest
          docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/front-end:latest
        fi

        if [ -d "./mosquitto" ]; then
          docker build -t mosquitto ./mosquitto
          docker tag mosquitto:latest 182399716240.dkr.ecr.us-east-1.amazonaws.com/mosquitto:latest
          docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/mosquitto:latest
        fi

        #  if [ -d "./nginx" ]; then
        #   docker build -t nginx ./nginx
        #   docker tag nginx:latest 182399716240.dkr.ecr.us-east-1.amazonaws.com/nginx:latest
        #   docker push 182399716240.dkr.ecr.us-east-1.amazonaws.com/nginx:latest
        # fi

    - name: Sign in to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # Decode the Base64 private key
        echo "$PRIVATE_KEY" | base64 --decode > github-ec2.pem
        chmod 600 github-ec2.pem

        # # Verify if the key is correctly formatted
        ssh-keygen -y -f github-ec2.pem > /dev/null || { echo "Invalid private key!"; exit 1; }

        # Ensure the back-end, front-end and mosquitto directories exists on EC2 before copying the required files.
        ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST} << 'EOF'

          if [ ! -d "/home/ubuntu/iot-server/back-end" ]; then
            mkdir -p /home/ubuntu/iot-server/back-end
            echo "Created directory: /home/ubuntu/iot-server/back-end"
          else
            echo "Directory already exists: /home/ubuntu/iot-server/back-end"
          fi

          if [ ! -d "/home/ubuntu/iot-server/front-end" ]; then
            mkdir -p /home/ubuntu/iot-server/front-end
            echo "Created directory: /home/ubuntu/iot-server/front-end"
          else
            echo "Directory already exists: /home/ubuntu/iot-server/front-end"
          fi

          if [ ! -d "/home/ubuntu/iot-server/mosquitto" ]; then
            mkdir -p /home/ubuntu/iot-server/mosquitto
            echo "Created directory: /home/ubuntu/iot-server/mosquitto"
          else
            echo "Directory already exists: /home/ubuntu/iot-server/mosquitto"
          fi

        EOF

        # Upload docker-compose.yml and nginx.conf using SCP
        scp -o StrictHostKeyChecking=no -i github-ec2.pem docker-compose.yml ${USER}@${HOST}:/home/ubuntu/iot-server/
        scp -o StrictHostKeyChecking=no -i github-ec2.pem nginx.conf ${USER}@${HOST}:/home/ubuntu/iot-server/

        scp -o StrictHostKeyChecking=no -i github-ec2.pem front-end/.env ${USER}@${HOST}:/home/ubuntu/iot-server/front-end/ # Might not be necessary
        scp -o StrictHostKeyChecking=no -i github-ec2.pem front-end/Dockerfile ${USER}@${HOST}:/home/ubuntu/iot-server/front-end/

        scp -o StrictHostKeyChecking=no -i github-ec2.pem back-end/.env ${USER}@${HOST}:/home/ubuntu/iot-server/back-end/ 
        scp -o StrictHostKeyChecking=no -i github-ec2.pem back-end/Dockerfile  ${USER}@${HOST}:/home/ubuntu/iot-server/back-end/ 

        scp -r -o StrictHostKeyChecking=no -i github-ec2.pem mosquitto ${USER}@${HOST}:/home/ubuntu/iot-server/ 


        # Execute Docker commands on EC2 via SSH
        ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST} << 'EOF'

          cd /home/ubuntu/iot-server/

          export NODE_ENV=production

          # Configure AWS CLI with the region
          export AWS_DEFAULT_REGION=us-east-1

          # Get ECR login token and login to Docker
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 182399716240.dkr.ecr.us-east-1.amazonaws.com
          # docker-compose pull back-end front-end mosquitto #nginx
          # docker-compose up -d --no-deps back-end front-end mosquitto nginx
          # docker image prune -f
          
          #**********************************************************
          # Check if swarm is initialized and initialize it if not.
          # if ! docker node ls &> /dev/null; then
          #   docker swarm init
          # fi
          # Deploy the stack.
          # docker stack deploy -c docker-compose.yml iot
        EOF