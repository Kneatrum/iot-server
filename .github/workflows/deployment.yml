jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # Convert GitHub secret to a proper private key file
        echo -e "$PRIVATE_KEY" > github-ec2.pem
        chmod 600 github-ec2.pem

        # Test if SSH key is correctly formatted
        ssh-keygen -y -f github-ec2.pem > /dev/null || { echo "Invalid private key!"; exit 1; }

        # SSH into EC2
        ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST} << 'EOF'
          echo "Current directory: $(pwd)"
          echo "Listing home directory:"
          ls -la ~
        EOF
