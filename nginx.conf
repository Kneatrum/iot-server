

events {}

http {

    upstream frontend {
        server front-end.1:80;
        server front-end.2:80;
    }

    upstream backend {
        server back-end.1:3000;
        server back-end.2:3000;
    }

    # Load balancing for Mosquitto service
    upstream mosquitto {
        server mosquitto.1:1883;
        server mosquitto.2:1883;
    }


    server {
        listen 80;
        # server_name localhost;

         # Proxy requests for the Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy requests for the Backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy requests for Mosquitto (MQTT)
        location /mqtt/ {
            proxy_pass http://mosquitto;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


